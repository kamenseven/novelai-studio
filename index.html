<div id="app">
  <div class="boot">
    <div class="boot-logo">
      <svg class="icon"><use href="#i-spark"></use></svg>
    </div>
    <div class="boot-name">NovelAI Studio</div>
    <div class="boot-sub">正在加载…</div>
  </div>
</div>

<noscript>需要启用 JavaScript 才能使用。</noscript>
<script type="module">
  import { boot } from './js/app.js';
  boot().catch((e) => {
    console.error(e);
    document.getElementById('app').innerHTML =
      '<div class="fatal">启动失败：' + (e && e.message ? e.message : e) + '</div>';
  });
</script>
</body>
</html>
